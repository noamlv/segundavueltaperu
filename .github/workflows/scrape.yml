name: Electoral scrapers

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JNE_POWERBI_URL: ${{ vars.JNE_POWERBI_URL || 'https://web.jne.gob.pe/reporteactasobservadas/' }}
      JNE_WAIT_SECONDS: ${{ vars.JNE_WAIT_SECONDS || '25' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database connection
        run: python scripts/check_database.py

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        run: python scripts/scrape_once.py
